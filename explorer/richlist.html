<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiChain Rich List</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06080d;--bg-2:#0c1018;--surface:#111827;--surface-2:#1a2236;
  --border:#1e293b;--border-light:#2d3a52;
  --text:#e8ecf4;--muted:#8896b0;--dim:#5e6b82;
  --accent:#6366f1;--accent-light:#818cf8;
  --cyan:#22d3ee;--green:#34d399;--gold:#fbbf24;--rose:#fb7185;
  --radius:16px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
a{color:var(--accent-light);text-decoration:none;}
a:hover{text-decoration:underline;}
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,8,13,0.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(30,41,59,0.5);}
.navbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{font-size:22px;font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);}
.pi-sym{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);font-size:20px;font-weight:900;color:white;}
.nav-links{display:flex;align-items:center;gap:8px;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:8px 16px;border-radius:var(--radius-sm);transition:color 0.2s,background 0.2s;}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.nav-links a.active{color:var(--accent-light);background:rgba(99,102,241,0.1);}
.hamburger{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:8px;}
@media(max-width:768px){.hamburger{display:block;}.nav-links{display:none;}.nav-links.active{display:flex;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:rgba(6,8,13,0.98);border-bottom:1px solid var(--border);padding:16px 24px;gap:4px;}}
.main{max-width:1200px;margin:0 auto;padding:88px 24px 48px;}
.page-title{font-size:32px;font-weight:800;margin-bottom:4px;}
.page-desc{color:var(--muted);margin-bottom:32px;font-size:15px;}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:14px;}
th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;}
tr:hover{background:rgba(99,102,241,0.04);}
.mono{font-family:'SF Mono',Monaco,monospace;font-size:13px;}
.addr{color:var(--cyan);cursor:pointer;}
.rank{font-weight:800;color:var(--gold);font-size:16px;}
.bar-cell{position:relative;}
.bar{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--cyan));margin-top:4px;}
</style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="nav-logo"><span class="pi-sym">&pi;</span> PiChain</a>
    <div class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/explorer" class="active">Explorer</a>
      <a href="/trade">Swap</a>
      <a href="/dex">DEX</a>
      <a href="/games">Games</a>
      <a href="/launch">Launch</a>
      <a href="/mine">Mine</a>
      <a href="/staking">Staking</a>
      <a href="/nft">NFTs</a>
      <a href="/download">Download</a>
    </div>
    <button class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('active')" aria-label="Menu">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </div>
</nav>

<div class="main">
  <h1 class="page-title">Rich List</h1>
  <p class="page-desc">Top 100 PIChain addresses by balance.</p>

  <table>
    <thead><tr><th style="width:60px;">#</th><th>Address</th><th>Balance</th><th style="width:200px;">Share</th></tr></thead>
    <tbody id="richlist-body"><tr><td colspan="4" style="color:var(--muted);text-align:center;">Loading...</td></tr></tbody>
  </table>
</div>

<script>
const API = window.location.origin;
function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const fmt = n => {
  if (n >= 1e15) return (n/1e9).toFixed(0)+' PI';
  if (n >= 1e9) return (n/1e9).toFixed(4)+' PI';
  return n.toLocaleString()+' base';
};

async function load() {
  try {
    const r = await fetch(API+'/api/v1/richlist?limit=100');
    const d = await r.json();
    const accounts = d.accounts || [];
    const maxBal = accounts.length ? accounts[0].balance : 1;
    const tbody = document.getElementById('richlist-body');
    if (!accounts.length) { tbody.innerHTML='<tr><td colspan="4" style="color:var(--muted);text-align:center;">No accounts found</td></tr>'; return; }
    tbody.innerHTML = accounts.map((a, i) => {
      const pct = maxBal > 0 ? (a.balance / maxBal * 100) : 0;
      return `<tr>
        <td class="rank">${i+1}</td>
        <td class="mono addr" onclick="window.location.href='/address#${a.address}'">${a.address}</td>
        <td>${fmt(a.balance)}</td>
        <td class="bar-cell">${pct.toFixed(1)}%<div class="bar" style="width:${pct}%"></div></td>
      </tr>`;
    }).join('');
  } catch(e) { console.error(e); }
}
load();
</script>
<div style="text-align:center;color:var(--dim);font-size:13px;margin-top:48px;padding:24px;border-top:1px solid var(--border);">PiChain &mdash; Computing the Infinite | <a href="/terms" style="color:var(--dim)">Terms</a> &middot; <a href="/privacy" style="color:var(--dim)">Privacy</a></div>
</body>
</html>
