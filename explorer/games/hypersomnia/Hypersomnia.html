<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta name="theme-color" content="#00aa00">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Hypersomnia — PiChain</title>
  <meta name="description" content="Competitive 2D shooter on PiChain">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="assets/common.css">
</head>
<body>
  <div oncontextmenu="return false;" class="center-container" id="progress-container">
    <div class="spinner" id="spinner"></div>
    <div class="downloading-text" id="downloading-text">Downloading... 0%</div>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-bar-inner" id="progress-bar-inner"></div>
    </div>
    <div class="progress-mb" id="progress-mb">0 MB</div>
  </div>
  <canvas oncontextmenu="return false;" id="canvas" tabindex="-1"></canvas>
  <script>
    // Register coi-serviceworker to add COEP/COOP headers enabling SharedArrayBuffer.
    // Required for WASM pthreads even when loaded in an iframe.
    // IMPORTANT: SW must be at the root (not /assets/) so its scope covers this HTML page.
    if ('serviceWorker' in navigator) {
      if (!navigator.serviceWorker.controller) {
        navigator.serviceWorker.register('coi-serviceworker.js').then(function(reg) {
          // Once activated, reload so the SW intercepts this page and adds COEP/COOP headers
          if (reg.installing) {
            reg.installing.addEventListener('statechange', function() {
              if (this.state === 'activated') window.location.reload();
            });
          } else if (reg.active) {
            window.location.reload();
          }
        }).catch(function(err) {
          console.warn('Service worker registration failed:', err);
        });
      }
    }
  </script>
  <script src="assets/common.js"></script>
  <script>
    const crazygames = false;
    var Module = create_module(false);
  </script>
  <script src="Hypersomnia.js" async></script>
</body>
</html>
