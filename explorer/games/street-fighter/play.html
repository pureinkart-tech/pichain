<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="icon" href="./public/images/vsLogo.png" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Street Fighter 2</title>
		<link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
		<link rel="stylesheet" href="src/style.css" />
		<script>
			(function () {
				const qs = new URLSearchParams(window.location.search);
				window.__autostart = qs.get('autostart') || 'practice';
				window.__sfRoomCode = qs.get('room') || '';
				window.__sfMatchId = qs.get('match') || '';
			})();
		</script>
		<script type="module" src="src/index.js"></script>
	</head>

	<body>
		<div id="pvp-indicator" class="pvp-indicator hidden">PVP: OFFLINE</div>
		<main>
			<canvas width="382px" height="224px"></canvas>
		</main>

		<!-- LOBBY OVERLAY (PvP) -->
		<div id="lobby-overlay" class="overlay hidden">
			<div class="overlay-content">
				<h1 class="overlay-title">PvP ARENA</h1>
				<div class="lobby-actions">
					<button id="btn-create" class="lobby-btn lobby-btn-primary">CREATE ROOM</button>
					<div id="join-section">
						<input id="input-room-code" maxlength="4" placeholder="CODE" class="room-input">
						<button id="btn-join" class="lobby-btn lobby-btn-secondary">JOIN</button>
					</div>
				</div>
				<div id="room-code-display" class="hidden">
					<p class="overlay-label">Room Code:</p>
					<h2 id="room-code" class="room-code"></h2>
					<p class="blink-text">Share this code with your opponent!</p>
				</div>
				<p id="lobby-status" class="status-text"></p>
				<button id="btn-lobby-back" class="lobby-btn lobby-btn-back">BACK</button>
			</div>
		</div>

		<!-- RESULT OVERLAY (non-embedded PvP only) -->
		<div id="result-overlay" class="overlay hidden">
			<div class="overlay-content">
				<h1 id="pvp-result-text" class="result-title"></h1>
				<div class="lobby-actions">
					<button id="btn-main-menu" class="lobby-btn lobby-btn-secondary">MAIN MENU</button>
				</div>
				<p id="rematch-status" class="status-text"></p>
			</div>
		</div>

		<audio
			id="kensTheme"
			src="./public/sounds/kens-theme.ogg"
			preload="auto"
			loop
		></audio>
		<audio
			id="sound-fighter-land"
			src="./public/sounds/land.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-kick-hit"
			src="./public/sounds/light-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-kick-hit"
			src="./public/sounds/medium-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-kick-hit"
			src="./public/sounds/heavy-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-attack"
			src="./public/sounds/light-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-attack"
			src="./public/sounds/medium-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-attack"
			src="./public/sounds/heavy-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-punch-hit"
			src="./public/sounds/light-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-punch-hit"
			src="./public/sounds/medium-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-punch-hit"
			src="./public/sounds/heavy-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-ken-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-ryu-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>

		<img id="KenStage" src="public/images/kenstage.png" alt="kenstage" />
		<img id="hud" src="public/images/hud.png" alt="HUD" />
		<img id="KenImage" src="./public/images/Ken.png" />
		<img id="RyuImage" src="public/images/Ryu.png" />
		<img id="ShadowImage" src="./public/images/shadow.png" />
		<img id="Decals" src="./public/images/decals.png" />
		<img id="Controls" src="./public/images/Controls.png" />
		<img id="Logo" src="./public/images/logo.png" />
		<img id="Winner" src="./public/images/winnerText.png" />
	</body>
</html>
