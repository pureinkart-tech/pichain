// Custom color picker to replace prompt() which gets blocked by popup blockers in iframes
window._unoPickColor=function(cb){
  var overlay=document.createElement('div');
  overlay.id='uno-color-picker-overlay';
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:999999;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;';
  var title=document.createElement('div');
  title.style.cssText='color:#fff;font-size:22px;font-weight:bold;margin-bottom:20px;font-family:sans-serif;text-shadow:0 2px 8px rgba(0,0,0,0.5);';
  title.textContent='Choose a color:';
  overlay.appendChild(title);
  var row=document.createElement('div');
  row.style.cssText='display:flex;gap:16px;';
  var colors=[['R','#ef4444','Red'],['G','#22c55e','Green'],['B','#3b82f6','Blue'],['Y','#eab308','Yellow']];
  colors.forEach(function(c){
    var btn=document.createElement('button');
    btn.style.cssText='width:80px;height:80px;border-radius:12px;border:3px solid #fff;cursor:pointer;font-size:18px;font-weight:bold;color:#fff;background:'+c[1]+';box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:transform 0.15s;';
    btn.textContent=c[2];
    btn.onmouseenter=function(){btn.style.transform='scale(1.1)'};
    btn.onmouseleave=function(){btn.style.transform='scale(1)'};
    btn.onclick=function(){document.body.removeChild(overlay);cb(c[0]);};
    row.appendChild(btn);
  });
  overlay.appendChild(row);
  document.body.appendChild(overlay);
};
// Suppress alert/confirm/prompt — causes popup blocker issues in iframes
window.alert=function(msg){console.log('[UNO]',msg);};
window.confirm=function(msg){console.log('[UNO] confirm:',msg);return true;};

// Fallback game-over detection via DOM polling
// Watches for "GAME OVER" + "wins!" text that React renders when game ends
(function(){
  if(window.parent===window)return; // not in iframe
  var sent=false;
  var params=new URLSearchParams(window.location.hash.split('?')[1]||'');
  var roomCode=params.get('roomCode')||'';
  setInterval(function(){
    if(sent)return;
    var body=document.body;
    if(!body)return;
    var text=body.innerText||'';
    if(text.indexOf('GAME OVER')!==-1 && text.indexOf('wins!')!==-1){
      sent=true;
      // Extract winner name: "PlayerX wins!"
      var match=text.match(/(\S+)\s+wins!/);
      var winnerName=match?match[1]:'';
      // Get local player name from the currentUserData socket event (stored by React)
      // Check multiple sources for local player name
      var localName='';
      try{
        // The app stores current user name in a React ref; check DOM for player indicators
        var headers=document.querySelectorAll('h1,h2,h3,.player-name,[class*="player"]');
        for(var i=0;i<headers.length;i++){
          var h=headers[i].textContent||'';
          if(h.indexOf('Player ')!==-1 && h.indexOf('wins')===-1){
            localName=h.trim();break;
          }
        }
      }catch(_e){}
      var isLocal=winnerName&&localName?winnerName===localName:false;
      console.log('[UNO Fallback] GAME OVER detected. Winner:',winnerName,'Local:',localName,'isLocal:',isLocal);
      try{
        window.parent.postMessage({type:'uno_game_over',winner:winnerName,isLocalWinner:isLocal},'*');
      }catch(_e){}
    }
  },1000);
})();
// Override prompt() as safety net — if cached JS still has prompt(), show color picker instead
var _origPrompt=window.prompt;
window.prompt=function(msg){
  if(msg&&msg.indexOf('color')!==-1){
    // Return null to skip the synchronous path, then show color picker
    // This won't work for the callback approach, but prevents white screen
    return null;
  }
  return _origPrompt?_origPrompt.apply(this,arguments):null;
};
