// PIChain: Override WebSocket to inject pvpRoom token for private server
(function(){
  var params = new URLSearchParams(window.location.search);
  var pvpRoom = params.get('pvpRoom');
  if (!pvpRoom) return;
  var _WS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    // Append pvpRoom to the WebSocket URL
    try {
      var u = new URL(url);
      u.searchParams.set('pvpRoom', pvpRoom);
      url = u.toString();
    } catch(e) {
      // If URL parsing fails, append manually
      url += (url.indexOf('?') >= 0 ? '&' : '?') + 'pvpRoom=' + encodeURIComponent(pvpRoom);
    }
    console.log('[PVP] WebSocket connecting to:', url);
    return protocols ? new _WS(url, protocols) : new _WS(url);
  };
  window.WebSocket.prototype = _WS.prototype;
  window.WebSocket.CONNECTING = 0;
  window.WebSocket.OPEN = 1;
  window.WebSocket.CLOSING = 2;
  window.WebSocket.CLOSED = 3;
  // Set inviteRoomId so the game client includes roomId in play request
  window.inviteRoomId = pvpRoom;
  console.log('[PVP] Set inviteRoomId:', pvpRoom);
})();

<script>
// PIChain PVP: auto-play + 15min timer + death detection + elimination
(function() {
  var params = new URLSearchParams(window.location.search);
  var pvpName = params.get('pvpName');
  var pvpRoom = params.get('pvpRoom');
  if (!pvpName) return;

  console.log('[PVP] Swordbattle PVP mode:', pvpName, 'room:', pvpRoom);

  var MATCH_DURATION = 1200; // 20 minutes
  var matchTime = MATCH_DURATION;
  var pvpDied = false;
  var pvpPlaying = false;
  var matchOver = false;
  var countdownInterval = null;
  var deathCheckTimer = null;

  // Inject PVP CSS: hide leaderboard, hide external links, block respawn
  var style = document.createElement('style');
  style.textContent =
    '.leaderboard-content,.leaderboard-header,.leaderboard-title,' +
    '.leaderboard-extra,.leaderboard-modal,.leaderboard-search,' +
    '.game-buttons,.changelogbutton,.profilebutton,.auth-buttons,' +
    '[class*="social"],[class*="discord"],[class*="changelog"],' +
    '[class*="partner"],.results-buttons' +
    '{display:none!important;}';
  document.head.appendChild(style);

  // Helper: try to extract kills count from the in-game HUD or results screen
  function getKills() {
    try {
      // Results screen: look for the info div with title "Stabs:" and the CountUp value
      var infoDivs = document.querySelectorAll('.results-container .info, .results .info');
      for (var i = 0; i < infoDivs.length; i++) {
        var titleEl = infoDivs[i].querySelector('.title');
        if (titleEl && titleEl.textContent && titleEl.textContent.trim().toLowerCase().indexOf('stab') >= 0) {
          var valEl = infoDivs[i].querySelector('span') || infoDivs[i];
          var text = valEl.textContent.replace(/[^0-9]/g, '');
          if (text) return parseInt(text, 10);
        }
      }
      // Fallback: try to read from the Phaser game canvas text (coin counter shows coins\nkills)
      // Can't reliably read canvas text, return 0
    } catch(_e) {}
    return 0;
  }

  // Auto-click Play
  var autoPlayTimer = setInterval(function() {
    try {
      var playBtn = document.getElementById('enterGame');
      if (playBtn && playBtn.textContent.trim() === 'Play!') {
        playBtn.click();
        pvpPlaying = true;
        clearInterval(autoPlayTimer);
        console.log('[PVP] Auto-play triggered for', pvpName);
        // Start timer and death detection after a brief delay
        setTimeout(startPvpTimer, 2000);
      }
    } catch(e) { console.log('[PVP] Auto-play error:', e); }
  }, 800);

  function startPvpTimer() {
    // Add PVP HUD with timer
    var hud = document.createElement('div');
    hud.id = 'pvp-hud';
    hud.style.cssText = 'position:fixed;top:8px;right:16px;z-index:99999;' +
      'background:rgba(0,0,0,0.7);border:1px solid #ef4444;border-radius:8px;' +
      'padding:10px 16px;font-family:sans-serif;text-align:center;pointer-events:none;';
    hud.innerHTML = '<div style="color:#ef4444;font-size:11px;font-weight:700;">PVP ELIMINATION</div>' +
      '<div id="pvp-timer" style="color:#fff;font-size:28px;font-weight:900;">20:00</div>' +
      '<div id="pvp-status" style="color:#4caf50;font-size:12px;">ALIVE</div>';
    document.body.appendChild(hud);

    var timerEl = document.getElementById('pvp-timer');
    countdownInterval = setInterval(function() {
      if (matchOver) return;
      matchTime--;
      var m = Math.floor(matchTime / 60);
      var s = matchTime % 60;
      timerEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
      if (matchTime <= 60) timerEl.style.color = '#ff6b6b';
      if (matchTime <= 0) {
        matchOver = true;
        clearInterval(countdownInterval);
        if (deathCheckTimer) clearInterval(deathCheckTimer);
        reportTimeout();
      }
    }, 1000);

    // Start death detection
    deathCheckTimer = setInterval(function() {
      if (pvpDied || matchOver) return;
      if (!pvpPlaying) return;
      try {
        var resultsEl = document.querySelector('.results-container, .results-main, .results');
        var playAgainEl = document.querySelector('.play-again');
        var stabText = document.querySelector('.results-title');

        var isDead = false;
        // Check multiple indicators — offsetParent, computed style, or just existence with content
        function isVisible(el) {
          if (!el) return false;
          if (el.offsetParent !== null) return true;
          var cs = window.getComputedStyle(el);
          return cs.display !== 'none' && cs.visibility !== 'hidden' && cs.opacity !== '0';
        }
        if (isVisible(playAgainEl)) isDead = true;
        if (isVisible(resultsEl)) isDead = true;
        if (isVisible(stabText) && stabText.textContent &&
            (stabText.textContent.includes('stabbed') || stabText.textContent.includes('Killed') ||
             stabText.textContent.includes('killed') || stabText.textContent.includes('Disconnect') ||
             stabText.textContent.includes('died') || stabText.textContent.includes('slain'))) {
          isDead = true;
        }
        // Also check for the results-main div which wraps the death screen
        var resultsMain = document.querySelector('.results-main');
        if (isVisible(resultsMain)) isDead = true;

        if (isDead) {
          pvpDied = true;
          matchOver = true;
          clearInterval(deathCheckTimer);
          if (countdownInterval) clearInterval(countdownInterval);

          var killerName = 'unknown';
          try { if (stabText) killerName = stabText.textContent.trim(); } catch(_e){}

          var kills = getKills();
          console.log('[PVP] Player died! Killed by:', killerName, 'Kills:', kills);

          // Report death to parent frame
          if (window.parent !== window) {
            window.parent.postMessage({
              type: 'swordbattle_player_died',
              playerName: pvpName,
              killedBy: killerName,
              kills: kills
            }, '*');
          }

          // Block respawn
          if (playAgainEl) playAgainEl.style.display = 'none';
          document.querySelectorAll('.results-buttons, .play-again, .to-home').forEach(function(el) {
            el.style.display = 'none';
          });

          // Update HUD
          var statusEl = document.getElementById('pvp-status');
          if (statusEl) { statusEl.textContent = 'ELIMINATED'; statusEl.style.color = '#ff6b6b'; }

          // Show elimination overlay
          var elimOverlay = document.createElement('div');
          elimOverlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.75);display:flex;flex-direction:column;align-items:center;justify-content:center;';
          elimOverlay.innerHTML = '<div style="color:#f87171;font-size:32px;font-weight:bold;text-shadow:0 0 20px rgba(248,113,113,0.5);">ELIMINATED</div>' +
            '<div style="color:#fff;font-size:16px;margin-top:12px;opacity:0.8;">Returning to match screen...</div>';
          document.body.appendChild(elimOverlay);
        }
      } catch(e) {}
    }, 500);
  }

  function reportTimeout() {
    console.log('[PVP] Match time expired — reporting timeout');

    var statusEl = document.getElementById('pvp-status');
    if (statusEl) { statusEl.textContent = 'TIME UP'; statusEl.style.color = '#42a5f5'; }

    // Report timeout to parent frame — include kills for tiebreaker
    if (window.parent !== window) {
      window.parent.postMessage({
        type: 'swordbattle_timeout',
        playerName: pvpName,
        kills: getKills()
      }, '*');
    }

    // Show time up overlay
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.75);display:flex;flex-direction:column;align-items:center;justify-content:center;';
    overlay.innerHTML = '<div style="color:#42a5f5;font-size:32px;font-weight:bold;text-shadow:0 0 20px rgba(66,165,245,0.5);">TIME UP!</div>' +
      '<div style="color:#4caf50;font-size:18px;margin-top:12px;">You survived!</div>' +
      '<div style="color:#aaa;font-size:14px;margin-top:8px;">Determining winner...</div>';
    document.body.appendChild(overlay);
  }

  // Timeout auto-play attempts after 30s
  setTimeout(function() { clearInterval(autoPlayTimer); }, 30000);
})();
</script>
