[package]
name = "pichain-miner-gui"
version.workspace = true
edition.workspace = true
description = "PIChain Desktop Miner — beautiful GUI mining app"

[[bin]]
name = "pichain-miner-gui"
path = "src/main.rs"

[dependencies]
pichain-crypto.workspace = true
pichain-types.workspace = true
pichain-mining.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
hex.workspace = true
anyhow.workspace = true
rayon.workspace = true
num_cpus = "1"
reqwest = { version = "0.12", features = ["json"] }
tauri = { version = "2", features = [] }
dirs = "6.0.0"
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
