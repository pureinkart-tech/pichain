# PIChain Prometheus Configuration
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "pichain-nodes"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "node1:8314"
          - "node2:8314"
          - "node3:8314"
          - "node4:8314"
        labels:
          network: "devnet"

  # For local testnet monitoring (public-testnet.sh)
  - job_name: "pichain-testnet-local"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "127.0.0.1:28314"
          - "127.0.0.1:28315"
          - "127.0.0.1:28316"
          - "127.0.0.1:28317"
        labels:
          network: "testnet"
