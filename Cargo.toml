[workspace]
resolver = "2"
members = [
    "crates/pichain-crypto",
    "crates/pichain-types",
    "crates/pichain-storage",
    "crates/pichain-consensus",
    "crates/pichain-execution",
    "crates/pichain-network",
    "crates/pichain-mining",
    "crates/pichain-rpc",
    "crates/pichain-node",
    "tools/pichain-cli",
    "tools/pichain-miner",
    "tools/pichain-miner-gui",
    "tools/pichain-bridge",
    "tools/pichain-signer",
]
exclude = [
    "explorer/games/mk48-src",
    "tools/pichain-wasm-signer",
]

[workspace.package]
version = "0.7.10"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pureinkart-tech/pichain"

[workspace.dependencies]
# Internal crates
pichain-crypto = { path = "crates/pichain-crypto" }
pichain-types = { path = "crates/pichain-types" }
pichain-storage = { path = "crates/pichain-storage" }
pichain-consensus = { path = "crates/pichain-consensus" }
pichain-execution = { path = "crates/pichain-execution" }
pichain-network = { path = "crates/pichain-network" }
pichain-mining = { path = "crates/pichain-mining" }
pichain-rpc = { path = "crates/pichain-rpc" }

# Cryptography
ed25519-dalek = { version = "2", features = ["serde", "batch", "rand_core"] }
blst = "0.3"
blake3 = "1"
rand = "0.8"

# Post-quantum cryptography (NIST FIPS 204 + FIPS 205)
pqcrypto-dilithium = "0.5"     # ML-DSA (Dilithium) — lattice-based signatures
pqcrypto-sphincsplus = "0.7"   # SLH-DSA (SPHINCS+) — hash-based signatures
pqcrypto-traits = "0.3"        # Traits for PQ signature operations
sha3 = "0.10"                  # SHA-3/Keccak for quantum-safe hash combiner

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-tungstenite = "0.24.0"

# Networking
libp2p = { version = "0.54", features = [
    "tokio",
    "gossipsub",
    "kad",
    "identify",
    "noise",
    "tcp",
    "quic",
    "yamux",
    "macros",
    "dns",
    "autonat",
    "relay",
] }

# Storage
rocksdb = { version = "0.22", features = ["multi-threaded-cf"] }

# Parallel execution
rayon = "1"
crossbeam = "0.8"
dashmap = "6"
parking_lot = "0.12"

# Logging & errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

# Web / RPC
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "compression-full", "set-header", "fs"] }
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

# WASM VM
wasmtime = "36"

# Config
toml = "0.8"

# EVM
revm = { version = "19", default-features = false, features = ["std", "serde"] }

# Erasure coding (Turbine block propagation)
reed-solomon-erasure = "6"

# Rate limiting (RPC security)
governor = "0.8"

# Misc
hex = "0.4.3"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
num-integer = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true

[profile.dev]
opt-level = 1
