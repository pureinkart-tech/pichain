name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: pichain-miner-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: pichain-miner-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: pichain-miner-macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: pichain-miner-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build miner
        run: cargo build --release --target ${{ matrix.target }} -p pichain-miner

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/pichain-miner ${{ matrix.artifact }}

      - name: Sign macOS binary (Developer ID)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --sign "Developer ID Application: $APPLE_TEAM_ID" --options runtime --force ${{ matrix.artifact }}

      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: codesign --sign - --force ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/pichain-miner.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-gui:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: pichain-miner-gui-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: pichain-miner-gui-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: pichain-miner-gui-macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: pichain-miner-gui-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build GUI Miner
        working-directory: tools/pichain-miner-gui
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/${{ matrix.artifact }}.AppImage 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb dist/${{ matrix.artifact }}.deb 2>/dev/null || true

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

      - name: Sign and collect macOS artifacts (Developer ID)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          mkdir -p dist
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --deep --force --options runtime \
              --sign "Developer ID Application: $APPLE_TEAM_ID" "$APP_PATH"

            DMG_STAGING=$(mktemp -d)
            cp -R "$APP_PATH" "$DMG_STAGING/"
            ln -s /Applications "$DMG_STAGING/Applications"
            hdiutil create -volname "PIChain Miner" -srcfolder "$DMG_STAGING" -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"
            rm -rf "$DMG_STAGING"

            # Notarize the DMG
            xcrun notarytool submit "dist/${{ matrix.artifact }}.dmg" \
              --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "dist/${{ matrix.artifact }}.dmg"
          fi

      - name: Collect macOS artifacts (unsigned fallback)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          mkdir -p dist
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --remove-signature "$APP_PATH" 2>/dev/null || true
            BINARY="$APP_PATH/Contents/MacOS/pichain-miner-gui"
            if [ -f "$BINARY" ]; then
              codesign --sign - --force "$BINARY"
            fi
            DMG_STAGING=$(mktemp -d)
            cp -R "$APP_PATH" "$DMG_STAGING/"
            ln -s /Applications "$DMG_STAGING/Applications"
            hdiutil create -volname "PIChain Miner" -srcfolder "$DMG_STAGING" -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"
            rm -rf "$DMG_STAGING"
          else
            cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/${{ matrix.artifact }}.dmg 2>/dev/null || true
          fi

      - name: Sign Windows artifacts
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $cert = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("certificate.pfx", $cert)
          $msi = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($file in @($msi, $exe)) {
            if ($file) {
              & signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file.FullName
            }
          }
          Remove-Item certificate.pfx

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/msi/*.msi dist/${{ matrix.artifact }}.msi 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/${{ matrix.artifact }}.exe 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: [build, build-gui]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
