name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            suffix: linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            suffix: macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake clang

      - uses: Swatinem/rust-cache@v2
        with:
          key: v075-${{ matrix.target }}

      # Build all 3 binaries: miner, signer, cli
      - name: Build pichain-miner
        run: cargo build --release --target ${{ matrix.target }} -p pichain-miner

      - name: Build pichain-signer
        run: cargo build --release --target ${{ matrix.target }} -p pichain-signer

      - name: Build pichain-cli
        run: cargo build --release --target ${{ matrix.target }} -p pichain-cli

      # Rename binaries (Unix)
      - name: Rename binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pichain-miner pichain-miner-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/pichain-signer pichain-signer-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/pichain-cli pichain-cli-${{ matrix.suffix }}

      # Sign macOS binaries
      - name: Sign macOS binaries (Developer ID)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for bin in pichain-miner-${{ matrix.suffix }} pichain-signer-${{ matrix.suffix }} pichain-cli-${{ matrix.suffix }}; do
            codesign --sign "Developer ID Application: $APPLE_TEAM_ID" --options runtime --force "$bin"
          done

      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          for bin in pichain-miner-${{ matrix.suffix }} pichain-signer-${{ matrix.suffix }} pichain-cli-${{ matrix.suffix }}; do
            codesign --sign - --force "$bin"
          done

      # Rename binaries (Windows)
      - name: Rename binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pichain-miner.exe pichain-miner-${{ matrix.suffix }}.exe
          cp target/${{ matrix.target }}/release/pichain-signer.exe pichain-signer-${{ matrix.suffix }}.exe
          cp target/${{ matrix.target }}/release/pichain-cli.exe pichain-cli-${{ matrix.suffix }}.exe

      # Upload all artifacts
      - name: Upload miner
        uses: actions/upload-artifact@v4
        with:
          name: pichain-miner-${{ matrix.suffix }}
          path: pichain-miner-${{ matrix.suffix }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: pichain-signer-${{ matrix.suffix }}
          path: pichain-signer-${{ matrix.suffix }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload cli
        uses: actions/upload-artifact@v4
        with:
          name: pichain-cli-${{ matrix.suffix }}
          path: pichain-cli-${{ matrix.suffix }}${{ runner.os == 'Windows' && '.exe' || '' }}

  build-gui:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: pichain-miner-gui-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: pichain-miner-gui-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: pichain-miner-gui-macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: pichain-miner-gui-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev cmake clang

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-v075-${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build GUI Miner
        working-directory: tools/pichain-miner-gui
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/${{ matrix.artifact }}.AppImage 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb dist/${{ matrix.artifact }}.deb 2>/dev/null || true

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

      - name: Sign and collect macOS artifacts (Developer ID)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          mkdir -p dist
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --deep --force --options runtime \
              --sign "Developer ID Application: $APPLE_TEAM_ID" "$APP_PATH"
            DMG_STAGING=$(mktemp -d)
            cp -R "$APP_PATH" "$DMG_STAGING/"
            ln -s /Applications "$DMG_STAGING/Applications"
            hdiutil create -volname "PIChain Miner" -srcfolder "$DMG_STAGING" -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"
            rm -rf "$DMG_STAGING"
            xcrun notarytool submit "dist/${{ matrix.artifact }}.dmg" \
              --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "dist/${{ matrix.artifact }}.dmg"
          fi

      - name: Collect macOS artifacts (unsigned fallback)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          mkdir -p dist
          # Find the .app built by Tauri
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, falling back to Tauri DMG"
            DMG_SRC=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
            if [ -n "$DMG_SRC" ]; then cp "$DMG_SRC" "dist/${{ matrix.artifact }}.dmg"; fi
          else
            # Ad-hoc sign the app inside the build environment
            codesign --sign - --force --deep "$APP_PATH"
            # Create custom DMG with the app + install script
            DMG_STAGING=$(mktemp -d)
            cp -R "$APP_PATH" "$DMG_STAGING/"
            ln -s /Applications "$DMG_STAGING/Applications"
            # Create install helper script inside the DMG
            cat > "$DMG_STAGING/Install PIChain Miner.command" << 'SCRIPT'
          #!/bin/bash
          # PIChain Miner — macOS Install Helper
          # Double-click this to install and fix macOS security blocks.
          set -e
          cd "$(dirname "$0")"
          APP_NAME="PIChain Miner.app"
          if [ ! -d "$APP_NAME" ]; then
            echo "Error: $APP_NAME not found. Open the DMG first."
            exit 1
          fi
          echo ""
          echo "  Installing PIChain Miner..."
          # Remove old version
          [ -d "/Applications/$APP_NAME" ] && rm -rf "/Applications/$APP_NAME"
          # Copy to Applications
          cp -R "$APP_NAME" "/Applications/$APP_NAME"
          # Remove quarantine + ad-hoc sign
          xattr -cr "/Applications/$APP_NAME" 2>/dev/null || true
          codesign --sign - --force --deep "/Applications/$APP_NAME" 2>/dev/null || true
          echo "  Done! Opening PIChain Miner..."
          open "/Applications/$APP_NAME"
          SCRIPT
            chmod +x "$DMG_STAGING/Install PIChain Miner.command"
            # Add plain-text install instructions (cannot be blocked by macOS)
            printf 'PIChain Miner - Install Instructions\n=====================================\n\nSTEP 1: Drag "PIChain Miner" to the Applications folder.\n\nSTEP 2: Open Terminal (Cmd+Space, type Terminal, press Enter)\n        and paste this command:\n\nxattr -cr "/Applications/PIChain Miner.app" && codesign --sign - --force --deep "/Applications/PIChain Miner.app"\n\nSTEP 3: Open PIChain Miner from Applications.\n\nWHY IS THIS NEEDED?\nmacOS blocks apps downloaded from the internet that are\nnot from the App Store. The command above removes this\nblock. You only need to do this once.\n' > "$DMG_STAGING/HOW TO INSTALL.txt"
            hdiutil create -volname "PIChain Miner" -srcfolder "$DMG_STAGING" -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"
            rm -rf "$DMG_STAGING"
          fi

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/msi/*.msi dist/${{ matrix.artifact }}.msi 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/${{ matrix.artifact }}.exe 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: [build, build-gui]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Copy installer scripts into artifacts
      - name: Add installer scripts
        run: |
          cp tools/install-mac.command artifacts/install-mac.command
          cp tools/install-windows.bat artifacts/install-windows.bat
          chmod +x artifacts/install-mac.command

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## PIChain ${{ github.ref_name }}

            **Post-Quantum Secure** — All tools use ML-DSA-65 + SLH-DSA-SHAKE-128f dual signatures.

            ### Downloads

            **For miners:** `pichain-miner` — compute PI digits and earn rewards
            **For everyone:** `pichain-signer` — lightweight wallet + signing proxy for DEX, staking, etc.
            **For developers:** `pichain-cli` — wallet generation, PI computation, and chain tools
            **GUI Miner:** Desktop app with built-in wallet management

            ### Features

            - Post-quantum signatures (ML-DSA-65 + SLH-DSA-SHAKE-128f)
            - π-smooth emission (half-life = π years, no cliff halvings)
            - 4-way π-native fee split (31.41% burn, 31.41% stakers, 18.59% miners, 18.59% proposer)
            - Send PI from desktop app and CLI
            - Browser mining (pool-style, no wallet needed)
            - VDF with progressive strengthening
          files: artifacts/*
